[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "it-support-chatbot"
version = "0.3.0"
description = "A privacy-conscious IT support chatbot with OpenAI and Ollama providers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.1",
  "openai==2.37.0",
  "python-dotenv==1.2.3",
  "uvicorn==0.47.0",
]

[project.scripts]
it-support-agent = "it_support_agent:main"

[tool.setuptools]
py-modules = ["it_support_agent", "run_ollama_agent"]

[tool.setuptools.packages.find]
include = ["it_support*"]

[tool.setuptools.package-data]
it_support = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "F403", "F405", "SIM117"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]
